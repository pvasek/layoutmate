name: macscreen
options:
  bundleIdPrefix: com.pavelvasek
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.pavelvasek.macscreen
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: macscreen/Info.plist
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  macscreen:
    type: application
    platform: macOS
    sources:
      - path: macscreen
    settings:
      base:
        PRODUCT_NAME: macscreen
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
